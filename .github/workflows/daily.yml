name: Tägliches Kalender-Update

on:
  schedule:
    - cron: '0 4 * * *'  # Täglich um 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # --- RUFF SYNTAX & CODE-CHECK ---
      - name: Python-Code mit Ruff prüfen
        uses: astral-sh/ruff-action@v3
        with:
          args: "check . --fix"


      - name: ICS Kalender generieren
        run: python generate_ics.py

      - name: Kalender committen und pushen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add deepsky.ics
          if ! git diff --cached --quiet; then
            git commit -m "Tägliches Update der Deep Sky Vorausschau"
            git push
          else
            echo "Keine Änderungen in deepsky.ics – Commit übersprungen."
          fi
