name: Tägliches Kalender-Update

on:
  schedule:
    - cron: '0 6 * * *'  # Jeden Tag um 06:00 Uhr UTC
  workflow_dispatch:      # Manuell ausführen

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skript ausführen
        run: python generate_ics.py

      - name: ICS-Datei auf GitHub speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add deepsky.ics
          git diff-index --quiet HEAD || git commit -m "Tägliches Update der Deep Sky Vorausschau"
          git push
